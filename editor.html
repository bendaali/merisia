<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur — Merisia</title>
  <script src="/csrf.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      if (parts[0] === 'guest') {
        window.MERISIA_GUEST_TOKEN = parts[1] || '';
        window.MERISIA_DESIGN_ID = '';
      } else {
        window.MERISIA_DESIGN_ID = parts[parts.length - 1] || '';
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

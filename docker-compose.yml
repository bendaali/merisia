services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merisia}
      POSTGRES_USER: ${POSTGRES_USER:-merisia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    volumes:
      - merisia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-merisia}
      POSTGRES_USER: ${POSTGRES_USER:-merisia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  merisia_pgdata:
